<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

:root{--bg:#f3f6f7;--surface:#ffffff;--ink:#13222c;--muted:#5a6b76;--line:#d5dee3;--accent:#0b5a6b;--accent-ink:#ffffff;--ok:#1d6b3a;--warn:#9a5b00;--bad:#a8281f;

:root[data-theme="dark"]{--bg:#0f1a20;--surface:#17252d;--ink:#e6eef1;--muted:#93a6b0;--line:#2a3c46;--accent:#5fc1d4;--accent-ink:#0a1a20;--ok:#6fd08f;--warn:#f0b35a;--bad:#ff8d82;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:16px 32px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.3rem;margin:0;text-wrap:balance}
h2{font-size:1.05rem;margin:0;text-wrap:balance}
h3{font-size:.95rem;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:.88rem}
textarea,input[type=search],input[type=text],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;display:inline-block;text-decoration:none;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:9px 14px;cursor:pointer}
.btn.alt{background:none;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.files{display:flex;gap:6px;flex-wrap:wrap}
.files .chip{font-size:.8rem}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:68vh;overflow:auto}
.row{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row[aria-current=true]{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent)}
.so{font-family:var(--mono);font-size:.85rem;font-weight:500}
.ten{display:block;font-size:.88rem;color:var(--muted)}
.tag{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.right{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;min-height:60vh}
.tabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1;min-width:0;overflow:auto;max-height:68vh}
.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:.9rem}
dt{color:var(--muted)}dd{margin:0}
.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-bad{color:var(--bad)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.nd{white-space:pre-wrap;max-height:260px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:.85rem}
.step{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.step b{font-weight:600}
.step .k{color:var(--muted);font-size:.82rem}
label{font-weight:600;font-size:.9rem;display:block}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.addp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mono{font-family:var(--mono)}
</style>
<div class="wrap">
<header><h1>Tra cứu pháp luật đất đai</h1>
<p class="sub">Văn bản Trung ương, tỉnh Phú Thọ (mới) và Vĩnh Phúc (cũ). Danh mục đối chiếu ngày 11/10/2026.</p></header>

<section class="ask" id="askbox" hidden>
<label for="sit">Câu hỏi cần tư vấn</label>
<textarea id="sit" rows="3" placeholder="Ví dụ: Hộ ông A xin tách thửa đất ở thành 2 thửa tại xã Tam Dương, thửa có GCN cấp năm 2015. Cần trình tự và căn cứ pháp lý."></textarea>
<div class="btns"><button class="btn alt" id="upbtn" type="button">Tải tài liệu lên</button><input type="file" id="up" multiple hidden>
<button class="btn" id="go" type="button">Tư vấn</button><span class="note" id="upnote"></span></div>
<div class="files" id="files"></div>
</section>

<section class="addp" id="addp" hidden><h2>Bổ sung văn bản pháp luật</h2>
<div class="f2"><div><label for="f_cap">Cấp</label><select id="f_cap"><option>Trung ương</option><option>Phú Thọ (mới)</option><option>Vĩnh Phúc (cũ)</option><option>Khác</option></select></div>
<div><label for="f_so">Số hiệu *</label><input id="f_so" type="text" placeholder="VD: 50/2026/NĐ-CP"></div>
<div><label for="f_ban">Ngày ban hành</label><input id="f_ban" type="text" placeholder="dd/mm/yyyy"></div>
<div><label for="f_hl">Hiệu lực từ</label><input id="f_hl" type="text" placeholder="dd/mm/yyyy"></div></div>
<label for="f_ten">Trích yếu *</label><input id="f_ten" type="text">
<label for="f_tt">Tình trạng hiệu lực</label><input id="f_tt" type="text" value="Còn hiệu lực">
<label for="f_pdf">Đường dẫn PDF hoặc trang văn bản (nếu có)</label><input id="f_pdf" type="text" placeholder="https://...">
<label for="f_nd">Toàn văn hoặc các điều cần dùng (dùng khi tư vấn)</label><textarea id="f_nd" rows="7"></textarea>
<div class="btns"><button class="btn" id="f_save" type="button">Lưu văn bản</button><button class="btn alt" id="f_cancel" type="button">Đóng</button></div><p class="note" id="f_msg"></p></section>

<div class="grid">
<div class="left">
<input type="search" id="q" placeholder="Tìm theo số hiệu hoặc nội dung" aria-label="Tìm văn bản">
<div class="btns"><span id="chips" class="btns"></span><button class="chip" id="addbtn" type="button" hidden>+ Bổ sung văn bản</button></div>
<div class="list" id="list" role="list"></div></div>
<section class="right">
<div class="tabs"><button class="chip" id="tabdoc" type="button" aria-pressed="true">Văn bản</button><button class="chip" id="tabadv" type="button" aria-pressed="false">Kết quả tư vấn</button></div>
<div class="body" id="body"></div>
<div class="foot"><button class="btn alt" id="xw" type="button" disabled>Xuất Word</button><button class="btn" id="xx" type="button" disabled>Xuất Excel</button></div>
</section></div></div>
